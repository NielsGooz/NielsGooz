<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-label="Serious software. Silly goose.">
  <style>
    .type { font: 400 60px Impact, "Arial Narrow Bold", "Helvetica Neue", Arial, sans-serif; letter-spacing: 1px; }
    .small { font: 400 25px Impact, "Arial Narrow Bold", "Helvetica Neue", Arial, sans-serif; letter-spacing: 1px; }
    .bob { animation: bob 3.4s ease-in-out infinite; transform-origin: 700px 170px; }
    .back { animation: swell 8s linear infinite; }
    .front { animation: swell 5s linear infinite; }
    .say { animation: say 3.4s ease-in-out infinite; transform-origin: 780px 62px; }
    .silly { animation: wobble 1.7s ease-in-out infinite alternate; transform-origin: 170px 118px; }
    @keyframes bob { 0%, 100% { transform: translateY(7px) rotate(-3deg); } 50% { transform: translateY(-7px) rotate(3deg); } }
    @keyframes swell { to { transform: translateX(-240px); } }
    @keyframes say { 0%, 45%, 100% { opacity: 0; transform: scale(.4) rotate(0); } 60%, 88% { opacity: 1; transform: scale(1) rotate(-6deg); } }
    @keyframes wobble { from { transform: rotate(-2deg); } to { transform: rotate(2deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .say { opacity: 1; } }
  </style>
  <rect width="900" height="260" rx="30" fill="#F5C343"/>
  <clipPath id="edge"><rect width="900" height="260" rx="30"/></clipPath>
  <g clip-path="url(#edge)">
    <text class="type" x="36" y="84" fill="#000">SERIOUS SOFTWARE.</text>
    <g class="silly"><text class="type" x="36" y="152" fill="#000">SILLY GOOSE.</text></g>
